<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        font-family: "Segoe UI", Arial, sans-serif;

        overflow: hidden;
      }

      .container {
        text-align: center;
        color: white;
        animation: fadeIn 1s ease-out;
      }

      .header-image {
        width: 100%;
        max-width: 480px;
        margin: 0 auto 20px;
        padding: 0 20px;
        animation:
          pop 0.8s ease-out,
          float 3s ease-in-out infinite 0.8s;
        background-color: #fff;
      }

      .header-image img {
        width: 100%;
        height: auto;
        display: block;
      }

      @media (max-width: 480px) {
        .header-image {
          max-width: 260px;
        }
      }

      h1 {
        font-size: 26px;
        letter-spacing: 1px;
        margin-bottom: 8px;
        animation: slideUp 0.8s ease-out 0.2s both;
      }

      p.subtitle {
        font-size: 15px;
        opacity: 0.85;
        margin-bottom: 30px;
        animation: slideUp 0.8s ease-out 0.4s both;
      }

      .spinner {
        width: 40px;
        height: 40px;
        margin: 0 auto 20px;
        border: 4px solid rgba(255, 255, 255, 0.25);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      .progress-bar {
        width: 220px;
        height: 5px;
        background: rgba(255, 255, 255, 0.25);
        border-radius: 10px;
        overflow: hidden;
        margin: 0 auto;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: white;
        border-radius: 10px;
        animation: fill 3s linear forwards;
      }

      .welcome-msg {
        font-size: 16px;
        line-height: 1.7;
        max-width: 320px;
        margin: 0 auto 28px;
        opacity: 0.9;
        direction: rtl;
        animation: slideUp 0.8s ease-out 0.5s both;
      }

      .redirect-text {
        margin-top: 14px;
        font-size: 13px;
        opacity: 0.7;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes pop {
        0% {
          transform: scale(0);
        }
        70% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes fill {
        from {
          width: 0%;
        }
        to {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header-image">
        <img
          src="https://ins-eddakhil2024.wuaze.com/wp-content/uploads/2024/09/1111-removebg-preview.png"
          alt="School Header"
        />
      </div>
      <h1>ABD ERRAHMAN DAKHIL</h1>
      <p class="subtitle">School Website</p>
      <p class="welcome-msg">مرحباً بكم طلابنا الأعزاء 👋<br />يتم تحميل الصفحة، الرجاء الانتظار قليلاً...</p>
      <div class="spinner"></div>
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
      <div class="redirect-text">Redirecting you in a few seconds...</div>
    </div>

    <script>
      // Change this URL to your actual destination
      const redirectURL = "https://ins-eddakhil2024.wuaze.com/?i=1";
      const delay = 3000; // 3 seconds, matches the progress bar animation

      setTimeout(function () {
        window.location.href = redirectURL;
      }, delay);
    </script>
  </body>
</html>
