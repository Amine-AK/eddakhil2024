<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redirecting...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    overflow: hidden;
  }

  .container {
    text-align: center;
    color: white;
    animation: fadeIn 1s ease-out;
  }

  .logo-circle {
    width: 110px;
    height: 110px;
    margin: 0 auto 25px;
    border-radius: 50%;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    font-weight: bold;
    color: #1e3c72;
    box-shadow: 0 0 0 8px rgba(255,255,255,0.15);
    animation: pop 0.8s ease-out, float 3s ease-in-out infinite 0.8s;
  }

  h1 {
    font-size: 26px;
    letter-spacing: 1px;
    margin-bottom: 8px;
    animation: slideUp 0.8s ease-out 0.2s both;
  }

  p.subtitle {
    font-size: 15px;
    opacity: 0.85;
    margin-bottom: 30px;
    animation: slideUp 0.8s ease-out 0.4s both;
  }

  .spinner {
    width: 40px;
    height: 40px;
    margin: 0 auto 20px;
    border: 4px solid rgba(255,255,255,0.25);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }

  .progress-bar {
    width: 220px;
    height: 5px;
    background: rgba(255,255,255,0.25);
    border-radius: 10px;
    overflow: hidden;
    margin: 0 auto;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: white;
    border-radius: 10px;
    animation: fill 3s linear forwards;
  }

  .redirect-text {
    margin-top: 14px;
    font-size: 13px;
    opacity: 0.7;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes pop {
    0% { transform: scale(0); }
    70% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes fill {
    from { width: 0%; }
    to { width: 100%; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="logo-circle">AD</div>
  <h1>ABD ERRAHMAN DAKHIL</h1>
  <p class="subtitle">School Website</p>
  <div class="spinner"></div>
  <div class="progress-bar">
    <div class="progress-fill"></div>
  </div>  
  <div class="redirect-text">Redirecting you in a few seconds...</div>
</div>

<script>
  // Change this URL to your actual destination
  const redirectURL = "https://ins-eddakhil2024.wuaze.com/?i=1";
  const delay = 3000; // 3 seconds, matches the progress bar animation

  setTimeout(function () {
    window.location.href = redirectURL;
  }, delay);
</script>

</body>
</html>
